# clientes/renzosnacks/config/client_config.yaml
# Cliente: Renzo Snacks — Restaurante de alitas, boneless y papas preparadas
# Activar con: CLIENT_ID=renzosnacks

# ─── Datos del negocio ───────────────────────────────────────
BUSINESS_NAME: "Renzo Snacks"
BUSINESS_TYPE: "Restaurante / snacks"
BUSINESS_DESCRIPTION: >
  Somos un restaurante enfocado en alitas, boneless y papas preparadas.
  Atendemos de lunes a sábado en horario nocturno. Ofrecemos servicio
  a domicilio, para recoger y consumo en el local.

# ─── Contacto y escalación ───────────────────────────────────
CONTACT_NAME: "Equipo Renzo Snacks"
CONTACT_PHONE: "9631000021"
BUSINESS_WHATSAPP: "9631000021"
BUSINESS_WHATSAPP_NUMBER: "9631000021"
# NOTA: El número 9631000021 ya es conocido por los clientes de Renzo Snacks.
# No asumir migración completa a Cloud API. Orden de opciones (ver README para detalle):
#   a) RECOMENDADO — Coexistencia: WhatsApp Business App + Cloud API en el mismo número
#      9631000021. El negocio conserva estados/historias/catálogo en la app; el bot usa
#      Cloud API para responder y tomar pedidos. Debe probarse antes de prometerse como
#      seguro.
#   b) RIESGO — Migrar 9631000021 completo a Cloud API sin coexistencia: puede perder el
#      uso normal de WhatsApp Business App (estados/historias). No ejecutar sin aprobación
#      explícita del cliente.
#   c) Número nuevo dedicado solo al bot, si la coexistencia no es viable.

# ─── Horario y ubicación ─────────────────────────────────────
BUSINESS_HOURS: "Lunes a sábado de 7:00 p.m. a 10:30 p.m."
BUSINESS_ADDRESS: "Primera Avenida Oriente Sur No. 74, Barrio San Sebastián"
INSTAGRAM: "@renzo_snacks"
FACEBOOK: "@renzosnacks"

# ─── Personalidad del agente ─────────────────────────────────
AGENT_NAME: "Asistente Renzo"
TONE: "Amable, natural, breve y humano — como alguien del restaurante"

# ─── Métodos de pago ─────────────────────────────────────────
PAYMENT_METHODS:
  - Efectivo
  - Transferencia
  - Tarjeta

# ─── Tipos de servicio ───────────────────────────────────────
SERVICE_TYPES:
  - nombre: "Envío a domicilio"
    nota: "Costo extra aproximado de $50, sujeto a ubicación. Pedir dirección al cliente."
  - nombre: "Consumo en el local"
  - nombre: "Recoger en local"

# ─── Reglas de negocio ───────────────────────────────────────
DELIVERY_COST_APPROX: 50          # Costo de envío de referencia en pesos MXN
DELIVERY_COST_NOTE: "El costo de envío se confirma según ubicación. $50 es referencia."
PREP_TIME_MIN: 25                  # Tiempo mínimo de preparación en minutos
PREP_TIME_MAX: 35                  # Tiempo máximo de preparación en minutos
PREP_TIME_NOTE: "Se prepara al momento; puede variar según cantidad del pedido."

# ─── Proveedor WhatsApp ──────────────────────────────────────
WHATSAPP_PROVIDER: "meta"
# Placeholders — configurar en Railway cuando el número esté listo:
# META_ACCESS_TOKEN: en .env
# META_PHONE_NUMBER_ID: en .env
# META_VERIFY_TOKEN: en .env

# ─── Imagen del menú ─────────────────────────────────────────
MENU_IMAGE_PATH: "clientes/renzosnacks/assets/menu_renzo_snacks.jpg"
MENU_MEDIA_ID: ""    # Rellenar tras subir a Meta Media API
MENU_IMAGE_URL: ""   # O usar URL pública si se hospeda externamente

# ─── Logo ────────────────────────────────────────────────────
