# clientes/renzosnacks/config/client_config.yaml
# Cliente: Renzo Snacks — Restaurante de alitas, boneless y papas preparadas
# Activar con: CLIENT_ID=renzosnacks

# ─── Datos del negocio ───────────────────────────────────────
BUSINESS_NAME: "Renzo Snacks"
BUSINESS_TYPE: "Restaurante / snacks"
BUSINESS_DESCRIPTION: >
  Somos un restaurante enfocado en alitas, boneless y papas preparadas.
  Atendemos de lunes a sábado en horario nocturno. Ofrecemos servicio
  a domicilio, para recoger y consumo en el local.

# ─── Contacto y escalación ───────────────────────────────────
CONTACT_NAME: "Equipo Renzo Snacks"
CONTACT_PHONE: "9631000021"
BUSINESS_WHATSAPP: "9631000021"

# ─── Horario y ubicación ─────────────────────────────────────
BUSINESS_HOURS: "Lunes a sábado de 7:00 p.m. a 10:30 p.m."
BUSINESS_ADDRESS: "Primera Avenida Oriente Sur No. 74, Barrio San Sebastián"
INSTAGRAM: "@renzo_snacks"
FACEBOOK: "@renzosnacks"

# ─── Personalidad del agente ─────────────────────────────────
AGENT_NAME: "Asistente Renzo"
TONE: "Amable, natural, breve y humano — como alguien del restaurante"

# ─── Métodos de pago ─────────────────────────────────────────
PAYMENT_METHODS:
  - Efectivo
  - Transferencia
  - Tarjeta

# ─── Tipos de servicio ───────────────────────────────────────
SERVICE_TYPES:
  - nombre: "Envío a domicilio"
    nota: "Tiene costo extra según zona"
  - nombre: "Consumo en el local"
  - nombre: "Recoger en local"

# ─── Proveedor WhatsApp ──────────────────────────────────────
WHATSAPP_PROVIDER: "meta"
# Placeholders — configurar en Railway cuando el número esté listo:
# META_ACCESS_TOKEN: en .env
# META_PHONE_NUMBER_ID: en .env
# META_VERIFY_TOKEN: en .env

# ─── Imagen del menú ─────────────────────────────────────────
