# ─── Integración Loyverse ─────────────────────────────────────
# Todos los productos están cargados en Loyverse con precios confirmados por el cliente.
# Activar cuando las credenciales estén listas:
LOYVERSE_ENABLED: false
# Las credenciales van en .env, NO aquí:
# LOYVERSE_ACCESS_TOKEN=
# LOYVERSE_STORE_ID=
# LOYVERSE_POS_DEVICE_ID=
# LOYVERSE_EMPLOYEE_ID=
# LOYVERSE_API_BASE_URL=https://api.loyverse.com/v1.0

# ─── Flujo de pedido ──────────────────────────────────────────
# El bot debe pedir en este orden:
ORDER_FLOW:
  - nombre
  - pedido
  - cantidad
  - salsa (si aplica)
  - bebida (si aplica)
  - complementos (si aplica)
  - modalidad         # envío / recoger / consumo en local
  - direccion         # solo si modalidad = envío
  - forma_de_pago
  - comentarios_especiales
# Después: mostrar resumen y pedir confirmación.
# Solo tras confirmar: enviar a Loyverse (si LOYVERSE_ENABLED=true).

# ─── Promociones ─────────────────────────────────────────────
PROMOTIONS_FILE: "clientes/renzosnacks/knowledge/promociones.md"
PROMOTIONS_UPDATE_DAY: "domingo"
PROMOTIONS_UPDATE_NOTE: "Actualizar cada domingo con las promos de la semana."

# ─── Promociones por comando de administrador (SPEC — no implementado) ───────
# Requiere lógica en el motor compartido (agent/) para verificar remitente y
# persistir en runtime/base de datos. Ver README.md → "Actualización de
# promociones por comandos de administrador (spec)". Las credenciales/listas
# van en .env, NO aquí:
# ADMIN_PHONE_NUMBERS=
# PROMOTIONS_ENABLED=true
PROMOTIONS_ADMIN_COMMANDS:
  - "ACTUALIZAR PROMOS"
  - "VER PROMOS"
  - "BORRAR PROMOS"
PROMOTIONS_ADMIN_REQUIRES_CONFIRMATION: true
PROMOTIONS_ADMIN_STORAGE: "runtime_database"   # nunca Git
