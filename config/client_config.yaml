# config/client_config.yaml — Plantilla de configuración por cliente
# Para crear un agente para un nuevo negocio: copia este archivo,
# rellena todos los campos y actualiza las variables de entorno en Railway.

# ─── Datos del cliente (Valoz Digital interno) ───────────────
CLIENT_NAME: "Valoz Digital"
CONTACT_NAME: "Equipo Valoz"
CONTACT_PHONE: ""                  # WhatsApp del humano que recibe escalaciones

# ─── Datos del negocio ───────────────────────────────────────
BUSINESS_NAME: "Valoz Digital"
BUSINESS_TYPE: "Agencia de automatización e IA"
BUSINESS_DESCRIPTION: >
  Valoz Digital ayuda a empresas a captar, atender y convertir más clientes mediante
  agentes de IA, páginas web profesionales y contenido para redes sociales.

# ─── Servicios y precios (resumen para el agente) ────────────
SERVICES:
  - nombre: "Agente IA WhatsApp Básico"
    precio: "$3,500 MXN implementación / desde $500 MXN al mes"
  - nombre: "Agente IA WhatsApp Pro"
    precio: "$7,500 MXN implementación / desde $900 MXN al mes"
  - nombre: "Agente IA WhatsApp Premium"
    precio: "$12,000 MXN implementación / desde $1,500 MXN al mes"
  - nombre: "Página web Landing"
    precio: "$4,000 MXN"
  - nombre: "Página web Profesional"
    precio: "$8,500 MXN"
  - nombre: "Página web Premium"
    precio: "$15,000 MXN"
  - nombre: "Contenido para redes Básico"
    precio: "$2,000 MXN/mes"
  - nombre: "Contenido para redes Pro"
    precio: "$5,000 MXN/mes"
  - nombre: "Contenido para redes Premium"
    precio: "$9,000 MXN/mes"
  - nombre: "Tarjeta digital NFC (reseñas)"
    precio: "$449 MXN"
  - nombre: "Tarjeta digital QR (reseñas)"
    precio: "$449 MXN"
  - nombre: "Paquete Presencia Inicial"
    precio: "$4,500 MXN (mensualidad opcional desde $500 MXN)"
  - nombre: "Paquete Reseñas y Reputación"
    precio: "$1,499 MXN (sin mensualidad obligatoria)"
  - nombre: "Paquete WhatsApp Inteligente"
    precio: "$5,500 MXN implementación / desde $700 MXN al mes"
  - nombre: "Paquete Ventas y Seguimiento"
    precio: "$8,500 MXN implementación / desde $1,000 MXN al mes"
  - nombre: "Paquete Negocio Automatizado"
    precio: "$15,000 MXN implementación / desde $1,800 MXN al mes"
  - nombre: "Paquete Presencia + Redes"
    precio: "desde $6,500 MXN al mes (setup según necesidad)"

# ─── Preguntas frecuentes ────────────────────────────────────
FAQ:
  - pregunta: "¿Cuánto tarda en estar listo el agente?"
    respuesta: "Entre 3 y 7 días hábiles según el paquete."
  - pregunta: "¿Tienen garantía?"
    respuesta: "Sí, ofrecemos ajustes sin costo en los primeros 15 días."
  - pregunta: "¿Puedo pagar en partes?"
    respuesta: "Sí, manejamos esquemas de pago. Pregunta a nuestro equipo."

# ─── Horario de atención ─────────────────────────────────────
BUSINESS_HOURS: "Lunes a domingo, 6:00 AM a 5:00 AM"

# ─── Personalidad del agente ─────────────────────────────────
AGENT_NAME: "Jarvis"
TONE: "Profesional, amigable, persuasivo y empático"

# ─── Integraciones (rellenar en .env, NO aquí) ───────────────
# GOOGLE_SHEET_ID: en .env
# GOOGLE_CALENDAR_ID: en .env
# META_PHONE_NUMBER_ID: en .env

# ─── Datos del proveedor WhatsApp ────────────────────────────
WHATSAPP_PROVIDER: "meta"          # meta | twilio

# ─── Modo de implementación de WhatsApp ──────────────────────
# Ver README_WHATSAPP_IMPLEMENTATION_MODES.md para el detalle de cada opción,
# sus riesgos y cuándo recomendarla al cliente.
whatsapp_implementation_mode: ""   # NUMERO_PRINCIPAL_API | NUMERO_SECUNDARIO_API | COEXISTENCIA_OFICIAL

# ─── Números autorizados para administrar promociones por WhatsApp ──────────
# Si se deja vacío, nadie puede actualizar promociones (comportamiento por defecto).
admin_numbers: []
# admin_numbers:
#   - "521XXXXXXXXXX"

# ─── Promociones administrables por WhatsApp ─────────────────
# Si se omite esta sección o enabled=false, el bot funciona normal — sin esta función.
promotion_settings:
  enabled: false
  allow_text_promos: true
  allow_image_promos: true
  current_promo_text_path: "knowledge/promociones.md"
  current_promo_image_path: "assets/promos/current_promo.jpg"

# ─── Estrategia comercial de canales sociales ─────────────────
# Documenta la estrategia comercial vigente: WhatsApp es el único canal que se
# vende como automatización completa. Instagram y Facebook son experimentales y
# solo sirven como captación manual hacia WhatsApp — no se venden como bot.
#
# El apagado/encendido REAL de Instagram/Facebook lo controlan las variables de
# entorno INSTAGRAM_ENABLED y FACEBOOK_MESSENGER_ENABLED en .env (por defecto
# "false" — ver .env.example y agent/providers/__init__.py). Estos campos son
# documentación de la estrategia comercial, no un segundo interruptor técnico.
social_channels_enabled: false
instagram_facebook_sales_enabled: false
main_sales_channel: whatsapp
